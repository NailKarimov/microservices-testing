name: Load test

# Manual, plus a weekly run of the load profile with Grafana. A stress run takes minutes and is not meant to
# gate every push, and GitHub's free runners (2 vCPU, 7 GB RAM) are smaller than the laptop the numbers in
# docs/test-report.md came from: this re-runs the same scripts on demand and keeps a dashboard of each run.
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Load test to run'
        type: choice
        options: [catalogue-browse, checkout]
        default: catalogue-browse
      profile:
        description: 'Profile'
        type: choice
        options: [smoke, load, stress]
        default: load
      observe:
        description: 'Send metrics to Prometheus and publish Grafana panels'
        type: boolean
        default: true
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC: catalogue-browse, load profile, with Grafana

permissions:
  contents: write # publish the dashboards to the gh-pages branch (under load/)

env:
  SCRIPT: ${{ inputs.script || 'catalogue-browse' }}
  PROFILE: ${{ inputs.profile || 'load' }}
  OBSERVE: ${{ (github.event_name == 'schedule' || inputs.observe) && '1' || '0' }}

jobs:
  loadtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (for the Grafana snapshots)
        if: env.OBSERVE == '1'
        run: npx playwright install --with-deps chromium

      - name: Start the Sock Shop microservices (Docker)
        run: npm run stack:up

      - name: Start Prometheus and Grafana
        if: env.OBSERVE == '1'
        run: |
          npm run obs:up
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/api/health && curl -sf http://localhost:9090/-/ready && exit 0
            sleep 2
          done
          docker compose -f infra/observability/docker-compose.yml logs --no-color --tail 80
          exit 1

      - name: Run the load test
        id: k6
        continue-on-error: true # thresholds may fail; the dashboard of a failing run matters most
        run: node scripts/run-k6.mjs "$SCRIPT" "$PROFILE"

      - name: Grafana panels as PNG
        if: env.OBSERVE == '1'
        run: node scripts/grafana-snapshots.mjs

      - name: Summary
        if: always()
        run: |
          f="loadtests-results/$SCRIPT-$PROFILE.json"
          if [ -f "$f" ]; then
            node -e '
              const m = require("./" + process.argv[1]).metrics;
              const d = m.http_req_duration, f = m.http_req_failed;
              console.log(`## k6: ${process.argv[2]} (${process.argv[3]})\n`);
              console.log(`| Requests | p50 | p95 | max | failed |\n|---:|---:|---:|---:|---:|`);
              console.log(`| ${m.http_reqs.count} | ${d.med.toFixed(0)} ms | ${d["p(95)"].toFixed(0)} ms | ${d.max.toFixed(0)} ms | ${(f.value * 100).toFixed(2)} % |`);
              console.log(`\nGrafana panels and the k6 HTML report: https://nailkarimov.github.io/microservices-testing/load/grafana/`);
            ' "$f" "$SCRIPT" "$PROFILE" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish to GitHub Pages (load/)
        if: always() && env.OBSERVE == '1' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: loadtests-results
          destination_dir: load
          keep_files: true # the Allure report lives in the same branch

      - name: Sock Shop logs (only when something failed)
        if: failure() || steps.k6.outcome == 'failure'
        run: docker compose -f infra/sock-shop/docker-compose.yml logs --no-color --tail 150

      - name: Stop everything
        if: always()
        run: |
          npm run obs:down || true
          npm run stack:down

      - name: Upload the k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-${{ env.SCRIPT }}-${{ env.PROFILE }}
          path: loadtests-results
          retention-days: 30

      - name: Fail if the k6 thresholds failed
        if: steps.k6.outcome == 'failure'
        run: exit 1
