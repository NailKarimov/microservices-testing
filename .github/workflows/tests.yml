name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write # publish the Allure report to the gh-pages branch

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5 # Allure CLI needs Java
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Start the Sock Shop microservices (Docker)
        run: npm run stack:up

      - name: Lint and type check
        run: |
          npm run lint
          npm run format:check
          npm run typecheck

      - name: Run tests
        id: tests
        continue-on-error: true
        env:
          # A missing Sock Shop stack must fail the run, not skip its tests.
          REQUIRE_STACK: '1'
        run: npm test

      - name: Restore Allure history
        if: always()
        run: |
          git fetch origin gh-pages --depth=1 || exit 0
          git worktree add gh-pages-old origin/gh-pages || exit 0
          if [ -d gh-pages-old/history ]; then
            mkdir -p allure-results/history
            cp -r gh-pages-old/history/. allure-results/history/
          fi

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Keep other reports and add the visual guides to GitHub Pages
        if: always()
        run: |
          cp docs/microservices.html allure-report/
          for f in docs/*.html; do if [ -f "$f" ]; then cp "$f" allure-report/; fi; done
          # Load-test dashboards are published by loadtest.yml; keep them when the Allure report replaces the site.
          if [ -d gh-pages-old/load ]; then cp -r gh-pages-old/load allure-report/; fi
          true

      - name: Publish Allure report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Sock Shop logs (only when something failed)
        if: steps.tests.outcome == 'failure'
        run: docker compose -f infra/sock-shop/docker-compose.yml logs --no-color --tail 150

      - name: Stop the Sock Shop
        if: always()
        run: npm run stack:down

      - name: Fail the job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
