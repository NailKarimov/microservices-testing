# Sock Shop (Weaveworks microservices demo), trimmed for API testing.
# Source: https://github.com/microservices-demo/microservices-demo (deploy/docker-compose)
#
# Differences from upstream:
#  - no load generator (user-sim) and no queue-master (it needs the Docker socket);
#  - every service is published on its own localhost port, so tests can call a service directly
#    or go through the edge router like a real client.
#
#   gateway (edge-router → front-end)  http://localhost:8081
#   catalogue  :8083   carts  :8084   orders  :8085   shipping  :8086   user  :8087   payment  :8082
name: sock-shop

services:
  edge-router:
    image: weaveworksdemos/edge-router:0.1.1
    ports: ['8081:80']
    depends_on: [front-end]
    cap_drop: [all]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    read_only: true
    tmpfs: ['/var/run:rw,noexec,nosuid']
    hostname: edge-router
  front-end:
    image: weaveworksdemos/front-end:0.3.12
    hostname: front-end
    cap_drop: [all]
    read_only: true
  catalogue:
    image: weaveworksdemos/catalogue:0.3.5
    hostname: catalogue
    ports: ['8083:80']
    cap_drop: [all]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
  catalogue-db:
    image: weaveworksdemos/catalogue-db:0.3.0
    hostname: catalogue-db
    environment:
      - MYSQL_ROOT_PASSWORD=fake_password
      - MYSQL_DATABASE=socksdb
  carts:
    image: weaveworksdemos/carts:0.4.8
    hostname: carts
    ports: ['8084:80']
    cap_drop: [all]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid']
    environment:
      - JAVA_OPTS=-Xms64m -Xmx128m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom -Dspring.zipkin.enabled=false
  carts-db:
    image: mongo:3.4
    hostname: carts-db
    cap_drop: [all]
    cap_add: [CHOWN, SETGID, SETUID]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid']
  orders:
    image: weaveworksdemos/orders:0.4.7
    hostname: orders
    ports: ['8085:80']
    cap_drop: [all]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid']
    environment:
      - JAVA_OPTS=-Xms64m -Xmx128m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom -Dspring.zipkin.enabled=false
  orders-db:
    image: mongo:3.4
    hostname: orders-db
    cap_drop: [all]
    cap_add: [CHOWN, SETGID, SETUID]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid']
  shipping:
    image: weaveworksdemos/shipping:0.4.8
    hostname: shipping
    ports: ['8086:80']
    cap_drop: [all]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid']
    environment:
      - JAVA_OPTS=-Xms64m -Xmx128m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom -Dspring.zipkin.enabled=false
  rabbitmq:
    image: rabbitmq:3.6.8
    hostname: rabbitmq
    # Published so tests can inspect the `shipping-task` queue the orders service publishes to
    # (no queue-master is started in this compose file, so messages stay there until a test reads them).
    ports: ['5672:5672']
    cap_drop: [all]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    read_only: true
  payment:
    image: weaveworksdemos/payment:0.4.3
    hostname: payment
    ports: ['8082:80']
    cap_drop: [all]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
  user:
    image: weaveworksdemos/user:0.4.4
    hostname: user
    ports: ['8087:80']
    cap_drop: [all]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    environment:
      - MONGO_HOST=user-db:27017
  user-db:
    image: weaveworksdemos/user-db:0.4.0
    hostname: user-db
    cap_drop: [all]
    cap_add: [CHOWN, SETGID, SETUID]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid']
